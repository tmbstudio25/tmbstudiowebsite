<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Content Manager — TMB Studio</title>
<link rel="stylesheet" href="./style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  body {
    overflow-x: hidden;
    scroll-snap-type: none;
    height: auto;
  }

  /* ---------- Login screen ---------- */
  .login-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    border: 1px solid var(--border-dim);
    background: rgba(255,255,255,0.02);
    padding: 2.5rem;
  }
  .login-card h1 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    color: var(--pure-white);
    margin-bottom: 0.5rem;
  }
  .login-card p { color: var(--grey-muted); font-size: 0.9rem; margin-bottom: 1.75rem; }
  .login-card input {
    width: 100%;
    background: var(--grey-deep);
    border: 1px solid var(--border-dim);
    color: var(--white-dim);
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 0.7rem 0.9rem;
    margin-bottom: 1rem;
  }
  .login-card input:focus { outline: none; border-color: var(--border-glow); }
  .login-error { color: #e08a8a; font-size: 0.85rem; margin-bottom: 1rem; min-height: 1.2em; }

  /* ---------- CMS shell (sidebar layout) ---------- */
  .cms-app { display: none; }
  .cms-app.ready { display: flex; min-height: 100vh; }

  .cms-sidebar {
    width: 240px;
    flex-shrink: 0;
    border-right: 1px solid var(--border-dim);
    padding: 2rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .cms-sidebar-brand {
    font-family: var(--font-display);
    font-size: 1.15rem;
    color: var(--pure-white);
    letter-spacing: 0.04em;
    margin-bottom: 2rem;
    padding: 0 0.5rem;
  }
  .cms-nav-item {
    display: block;
    width: 100%;
    text-align: left;
    font-family: var(--font-heading);
    font-size: 0.78rem;
    letter-spacing: 0.1rem;
    text-transform: uppercase;
    color: var(--grey-muted);
    background: transparent;
    border: none;
    border-left: 2px solid transparent;
    padding: 0.75rem 0.9rem;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .cms-nav-item:hover { color: var(--white-dim); background: rgba(255,255,255,0.03); }
  .cms-nav-item.active {
    color: var(--pure-white);
    border-left-color: var(--border-glow);
    background: rgba(255,255,255,0.05);
  }
  .cms-sidebar-footer {
    margin-top: auto;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border-dim);
  }
  .cms-sidebar-footer .cms-btn { width: 100%; }
  .cms-user-email {
    font-size: 0.72rem;
    color: var(--grey-muted);
    padding: 0 0.5rem 0.75rem;
    word-break: break-all;
  }

  .cms-main {
    flex: 1;
    min-width: 0;
    padding: 3rem 3rem 6rem;
  }
  .cms-page { display: none; max-width: 780px; }
  .cms-page.active { display: block; }
  .cms-page-header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-dim); }
  .cms-page-header h1 {
    font-family: var(--font-display);
    font-size: 1.9rem;
    color: var(--pure-white);
    letter-spacing: 0.04em;
    margin-bottom: 0.4rem;
  }
  .cms-page-header p { color: var(--grey-muted); font-size: 0.95rem; }

  .cms-btn {
    font-family: var(--font-heading);
    font-size: 0.72rem;
    letter-spacing: 0.15rem;
    text-transform: uppercase;
    padding: 0.65rem 1.3rem;
    border: 1px solid var(--border-dim);
    background: transparent;
    color: var(--white-dim);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .cms-btn:hover { border-color: var(--border-glow); background: rgba(255,255,255,0.06); }
  .cms-btn.primary { background: var(--white); color: var(--black); border-color: var(--white); }
  .cms-btn.primary:hover { background: transparent; color: var(--white); }
  .cms-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .cms-btn:disabled:hover { background: transparent; border-color: var(--border-dim); }

  .cms-status {
    font-family: var(--font-heading);
    font-size: 0.68rem;
    letter-spacing: 0.1rem;
    color: var(--grey-muted);
    min-height: 1.2em;
  }
  .cms-status.saved { color: #8aff8a; }
  .cms-status.error { color: #e08a8a; }

  .cms-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin: -3rem -3rem 2rem;
    padding: 1.25rem 3rem;
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(10, 10, 10, 0.97);
    border-bottom: 1px solid var(--border-dim);
  }
  .cms-toolbar-actions { display: flex; gap: 0.6rem; align-items: center; }

  .cms-field {
    border: 1px solid var(--border-dim);
    background: rgba(255,255,255,0.015);
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
  .cms-field label {
    display: block;
    font-family: var(--font-heading);
    font-size: 0.7rem;
    letter-spacing: 0.12rem;
    text-transform: uppercase;
    color: var(--grey-light);
    margin-bottom: 0.75rem;
  }
  .cms-field input[type="text"],
  .cms-field textarea {
    width: 100%;
    background: var(--grey-deep);
    border: 1px solid var(--border-dim);
    color: var(--white-dim);
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 0.65rem 0.85rem;
    resize: vertical;
  }
  .cms-field input[type="text"]:focus,
  .cms-field textarea:focus { outline: none; border-color: var(--border-glow); }
  .cms-field textarea { min-height: 90px; }

  .cms-media-row { display: flex; gap: 1.25rem; align-items: flex-start; margin-bottom: 0.75rem; flex-wrap: wrap; }
  .cms-preview {
    width: 200px;
    height: 112.5px; /* 16:9 */
    background: var(--grey-mid);
    border: 1px solid var(--border-dim);
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cms-preview img, .cms-preview video { width: 100%; height: 100%; object-fit: cover; }
  .cms-preview.empty {
    color: var(--grey-muted);
    font-family: var(--font-heading);
    font-size: 0.65rem;
    letter-spacing: 0.1rem;
    text-align: center;
    padding: 0.5rem;
  }
  .cms-media-controls { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 0.5rem; }
  .cms-media-btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .cms-upload-label {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    font-family: var(--font-heading);
    font-size: 0.68rem;
    letter-spacing: 0.1rem;
    text-transform: uppercase;
    color: var(--white-dim);
    border: 1px solid var(--border-dim);
    padding: 0.45rem 0.9rem;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .cms-upload-label:hover { border-color: var(--border-glow); }
  .cms-upload-label.danger { color: #e08a8a; }
  .cms-upload-label.danger:hover { border-color: #e08a8a; }
  .cms-hint { font-size: 0.78rem; color: var(--grey-muted); line-height: 1.5; }
  .cms-hint.warn { color: #d9a05b; }
  .cms-hint.error { color: #e08a8a; }

  .cms-notice {
    border-left: 2px solid var(--border-glow);
    background: rgba(255,255,255,0.03);
    padding: 1.25rem 1.5rem;
    margin-bottom: 2rem;
    color: var(--grey-muted);
    font-size: 0.92rem;
    line-height: 1.7;
  }
  .cms-notice strong { color: var(--white-dim); }
  .cms-notice input[type="text"] {
    width: 100%;
    background: var(--grey-deep);
    border: 1px solid var(--border-dim);
    color: var(--white-dim);
    font-family: var(--font-body);
    font-size: 0.85rem;
    padding: 0.5rem 0.7rem;
    margin-top: 0.5rem;
  }

  .cms-preview-links { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 2rem; }
</style>
</head>
<body>

  <!-- ============================================================
       LOGIN SCREEN
       ============================================================ -->
  <div class="login-shell" id="loginShell">
    <div class="login-card">
      <h1>Content Manager</h1>
      <p>Sign in with the admin account created in Supabase to edit TMB Studio's site.</p>
      <div class="login-error" id="loginError"></div>
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" />
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
      <button class="cms-btn primary" id="loginBtn" style="width: 100%;">Sign In</button>
    </div>
  </div>

  <!-- ============================================================
       CMS APP (shown after successful login)
       ============================================================ -->
  <div class="cms-app" id="cmsApp">
    <div class="cms-sidebar">
      <div class="cms-sidebar-brand">TMB Studio</div>
      <div id="navList"></div>
      <div class="cms-sidebar-footer">
        <div class="cms-user-email" id="userEmail"></div>
        <button class="cms-btn" id="logoutBtn">Sign Out</button>
      </div>
    </div>

    <div class="cms-main">
      <div id="pagesEl"></div>
    </div>
  </div>

  <script>
    /* ============================================================
       CONFIG — fill in once your Cloudflare Worker is deployed.
       Also editable live below (saved to this browser only).
       ============================================================ */
    const SUPABASE_URL = "https://rmfyfinfiujiqwljuxld.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtZnlmaW5maXVqaXF3bGp1eGxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NTcwMTgsImV4cCI6MjEwMjMzMzAxOH0.aJVN9JwpiJLA1Q-x_r9hfmAl7KRwTv97MHsJuWh-td8";
    const DEFAULT_R2_PUBLIC_URL = "https://pub-f1f78e5c68c242538bedd84c6ee971df.r2.dev";

    const CMS_KEY = "tmb_cms_content";
    const WORKER_URL_KEY = "tmb_cms_worker_url";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getWorkerUrl() {
      return (localStorage.getItem(WORKER_URL_KEY) || "").trim().replace(/\/$/, "");
    }
    function setWorkerUrl(v) {
      localStorage.setItem(WORKER_URL_KEY, v.trim().replace(/\/$/, ""));
    }

    /* ============================================================
       SCHEMA — grouped into pages so the sidebar can render each
       as its own "screen" rather than a flat list of everything.
       ============================================================ */
    const PAGES = [
      {
        id: "connections", label: "Connections",
        kind: "connections",
      },
      {
        id: "home", label: "Home",
        kind: "fields",
        description: "The hero video, the Who We Are carousel, and the two project cards on the home page.",
        fields: [
          { path: "home.aboutImages.0", label: "Who We Are — image 1", type: "image" },
          { path: "home.aboutImages.1", label: "Who We Are — image 2", type: "image" },
          { path: "home.aboutImages.2", label: "Who We Are — image 3", type: "image" },
          { path: "home.aboutImages.3", label: "Who We Are — image 4", type: "image" },
          { path: "home.projects.0.title", label: "Project 1 — title", type: "text" },
          { path: "home.projects.0.description", label: "Project 1 — description", type: "textarea" },
          { path: "home.projects.0.media", label: "Project 1 — card video", type: "video" },
          { path: "home.projects.0.tag", label: "Project 1 — status tag", type: "text" },
          { path: "home.projects.0.genre", label: "Project 1 — genre", type: "text" },
          { path: "home.projects.0.platform", label: "Project 1 — platform", type: "text" },
          { path: "home.projects.0.link", label: "Project 1 — link", type: "text" },
          { path: "home.projects.1.title", label: "Project 2 — title", type: "text" },
          { path: "home.projects.1.description", label: "Project 2 — description", type: "textarea" },
          { path: "home.projects.1.media", label: "Project 2 — card image", type: "image" },
          { path: "home.projects.1.tag", label: "Project 2 — status tag", type: "text" },
          { path: "home.projects.1.genre", label: "Project 2 — genre", type: "text" },
          { path: "home.projects.1.platform", label: "Project 2 — platform", type: "text" },
          { path: "home.projects.1.link", label: "Project 2 — link", type: "text" },
        ]
      },
      {
        id: "ngilai", label: "NGILAI",
        kind: "fields",
        description: "Everything on the NGILAI project page.",
        fields: [
          { path: "ngilai.heroBackground", label: "Full-screen hero background", type: "image" },
          { path: "ngilai.title", label: "Title", type: "text" },
          { path: "ngilai.tagline", label: "Tagline", type: "text" },
          { path: "ngilai.status", label: "Status badge", type: "text" },
          { path: "ngilai.coverImage", label: "Cover image (About section)", type: "image" },
          { path: "ngilai.description.0", label: "Description — paragraph 1", type: "textarea" },
          { path: "ngilai.description.1", label: "Description — paragraph 2", type: "textarea" },
          { path: "ngilai.description.2", label: "Description — paragraph 3", type: "textarea" },
          { path: "ngilai.chapters.0.title", label: "Chapter 1 — title", type: "text" },
          { path: "ngilai.chapters.0.text", label: "Chapter 1 — text (use <br> for a line break)", type: "textarea" },
          { path: "ngilai.chapters.0.image", label: "Chapter 1 — image", type: "image" },
          { path: "ngilai.chapters.1.title", label: "Chapter 2 — title", type: "text" },
          { path: "ngilai.chapters.1.text", label: "Chapter 2 — text", type: "textarea" },
          { path: "ngilai.chapters.1.image", label: "Chapter 2 — image", type: "image" },
          { path: "ngilai.chapters.2.title", label: "Chapter 3 — title", type: "text" },
          { path: "ngilai.chapters.2.text", label: "Chapter 3 — text", type: "textarea" },
          { path: "ngilai.chapters.2.image", label: "Chapter 3 — image", type: "image" },
          { path: "ngilai.chapters.3.title", label: "Chapter 4 — title", type: "text" },
          { path: "ngilai.chapters.3.text", label: "Chapter 4 — text", type: "textarea" },
          { path: "ngilai.chapters.3.image", label: "Chapter 4 — image", type: "image" },
          { path: "ngilai.exhibitionEventName", label: "Exhibition — event name", type: "text" },
          { path: "ngilai.exhibitionText1", label: "Exhibition — paragraph 1", type: "textarea" },
          { path: "ngilai.exhibitionText2", label: "Exhibition — paragraph 2", type: "textarea" },
        ]
      },
      {
        id: "lifegacha", label: "Life Gacha!",
        kind: "fields",
        description: "Everything on the Life Gacha! project page.",
        fields: [
          { path: "lifegacha.heroBackground", label: "Full-screen hero background", type: "image" },
          { path: "lifegacha.title", label: "Title", type: "text" },
          { path: "lifegacha.tagline", label: "Tagline", type: "text" },
          { path: "lifegacha.status", label: "Status badge", type: "text" },
          { path: "lifegacha.coverImage", label: "Cover image (About section)", type: "image" },
          { path: "lifegacha.description", label: "Description", type: "textarea" },
          { path: "lifegacha.features.0.title", label: "Feature 1 — title", type: "text" },
          { path: "lifegacha.features.0.text", label: "Feature 1 — text", type: "textarea" },
          { path: "lifegacha.features.1.title", label: "Feature 2 — title", type: "text" },
          { path: "lifegacha.features.1.text", label: "Feature 2 — text", type: "textarea" },
          { path: "lifegacha.features.2.title", label: "Feature 3 — title", type: "text" },
          { path: "lifegacha.features.2.text", label: "Feature 3 — text", type: "textarea" },
          { path: "lifegacha.exhibitionEventName", label: "Exhibition — event name", type: "text" },
          { path: "lifegacha.exhibitionText1", label: "Exhibition — paragraph 1", type: "textarea" },
          { path: "lifegacha.exhibitionText2", label: "Exhibition — paragraph 2", type: "textarea" },
        ]
      }
    ];

    let content = {};
    let session = null;
    let saveTimer = null;

    function getPath(obj, path) {
      return path.split(".").reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), obj);
    }
    function setPath(obj, path, value) {
      const keys = path.split(".");
      let cur = obj;
      for (let i = 0; i < keys.length - 1; i++) {
        const k = keys[i];
        const nextIsIndex = /^\d+$/.test(keys[i + 1]);
        if (cur[k] === undefined || cur[k] === null) cur[k] = nextIsIndex ? [] : {};
        cur = cur[k];
      }
      cur[keys[keys.length - 1]] = value;
    }

    async function loadContent() {
      let base = {};
      try {
        const res = await fetch("./content.json", { cache: "no-store" });
        if (res.ok) base = await res.json();
      } catch (e) { console.warn("Could not load content.json", e); }
      try {
        const raw = localStorage.getItem(CMS_KEY);
        if (raw) base = JSON.parse(raw);
      } catch (e) {}
      content = base;
    }

    function saveLocalPreview() {
      localStorage.setItem(CMS_KEY, JSON.stringify(content));
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      setStatus(`Saved to this browser · ${timeStr}`, "saved");
    }

    function markUnsaved() {
      setStatus("Unsaved changes — saving…", "");
    }

    function setStatus(msg, cls) {
      const statusEl = document.getElementById("statusEl");
      if (!statusEl) return;
      statusEl.textContent = msg;
      statusEl.className = "cms-status" + (cls ? " " + cls : "");
    }

    function flashStatus(msg, cls) {
      // Kept for error messages that should stand out but not persist forever.
      setStatus(msg, cls);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveLocalPreview(), 2600);
    }

    /* ============================================================
       CLOUDFLARE WORKER — upload / delete
       ============================================================ */
    async function uploadToWorker(file) {
      const workerUrl = getWorkerUrl();
      if (!workerUrl) throw new Error("Set your Cloudflare Worker URL on the Connections page first.");
      const form = new FormData();
      form.append("file", file);
      const res = await fetch(`${workerUrl}/upload`, {
        method: "POST",
        headers: { Authorization: `Bearer ${session.access_token}` },
        body: form,
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `Upload failed (${res.status})`);
      }
      return res.json(); // { url, key }
    }

    async function deleteFromWorker(key) {
      const workerUrl = getWorkerUrl();
      if (!workerUrl || !key) return;
      const res = await fetch(`${workerUrl}/delete`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${session.access_token}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ key }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `Delete failed (${res.status})`);
      }
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    /* ============================================================
       RENDERING
       ============================================================ */
    function renderSidebar() {
      const navList = document.getElementById("navList");
      navList.innerHTML = "";
      PAGES.forEach((page, i) => {
        const btn = document.createElement("button");
        btn.className = "cms-nav-item" + (i === 0 ? " active" : "");
        btn.textContent = page.label;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".cms-nav-item").forEach(b => b.classList.remove("active"));
          document.querySelectorAll(".cms-page").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("page-" + page.id).classList.add("active");
        });
        navList.appendChild(btn);
      });
    }

    function renderTextField(field) {
      const wrap = document.createElement("div");
      wrap.className = "cms-field";
      const label = document.createElement("label");
      label.textContent = field.label;
      wrap.appendChild(label);

      const currentVal = getPath(content, field.path) || "";
      const input = document.createElement(field.type === "textarea" ? "textarea" : "input");
      if (field.type === "text") input.type = "text";
      input.value = currentVal;
      input.addEventListener("input", () => {
        setPath(content, field.path, input.value);
        saveLocalPreview();
      });
      wrap.appendChild(input);
      return wrap;
    }

    function renderSimpleMediaField(field) {
      const wrap = document.createElement("div");
      wrap.className = "cms-field";
      const label = document.createElement("label");
      label.textContent = field.label;
      wrap.appendChild(label);

      const currentVal = getPath(content, field.path) || "";
      const row = document.createElement("div");
      row.className = "cms-media-row";

      const preview = document.createElement("div");
      preview.className = "cms-preview";
      const mediaEl = document.createElement(field.type === "video" ? "video" : "img");
      if (field.type === "video") { mediaEl.muted = true; mediaEl.controls = true; }
      mediaEl.src = currentVal;
      preview.appendChild(mediaEl);
      row.appendChild(preview);

      const controls = document.createElement("div");
      controls.className = "cms-media-controls";

      const pathInput = document.createElement("input");
      pathInput.type = "text";
      pathInput.placeholder = "./assets/your-file.jpg";
      pathInput.value = currentVal;
      pathInput.addEventListener("input", () => {
        setPath(content, field.path, pathInput.value);
        mediaEl.src = pathInput.value;
        saveLocalPreview();
      });

      const uploadLabel = document.createElement("label");
      uploadLabel.className = "cms-upload-label";
      uploadLabel.textContent = "Upload " + (field.type === "video" ? "video" : "image") + " file";
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = field.type === "video" ? "video/*" : "image/*";
      fileInput.style.display = "none";
      uploadLabel.appendChild(fileInput);

      const hint = document.createElement("div");
      hint.className = "cms-hint";
      hint.textContent = field.type === "video"
        ? "This embeds the video directly in content.json as base64, which can get large. Prefer uploading it to your assets folder and pasting the path — the fully bucket-backed upload/change/delete flow (like the Home background video) is coming to more fields soon."
        : "Uploading here embeds the image directly in content.json. For a lighter file, upload to your assets folder instead and paste its path above.";

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files[0];
        if (!file) return;
        const dataUrl = await fileToDataURL(file);
        pathInput.value = dataUrl;
        mediaEl.src = dataUrl;
        setPath(content, field.path, dataUrl);
        saveLocalPreview();
      });

      controls.appendChild(pathInput);
      controls.appendChild(uploadLabel);
      controls.appendChild(hint);
      row.appendChild(controls);
      wrap.appendChild(row);
      return wrap;
    }

    // The Home background video: real Upload / Change / Delete against
    // the Cloudflare bucket, not just a pasted path.
    function renderManagedVideoField() {
      const wrap = document.createElement("div");
      wrap.className = "cms-field";
      const label = document.createElement("label");
      label.textContent = "Looping background video (top of home page)";
      wrap.appendChild(label);

      const row = document.createElement("div");
      row.className = "cms-media-row";

      const preview = document.createElement("div");
      const currentUrl = getPath(content, "home.heroVideo") || "";
      preview.className = "cms-preview" + (currentUrl ? "" : " empty");
      const videoEl = document.createElement("video");
      videoEl.muted = true;
      videoEl.controls = true;
      if (currentUrl) {
        videoEl.src = currentUrl;
        preview.appendChild(videoEl);
      } else {
        preview.textContent = "No video set";
      }
      row.appendChild(preview);

      const controls = document.createElement("div");
      controls.className = "cms-media-controls";

      const hint = document.createElement("div");
      hint.className = "cms-hint";
      hint.textContent = currentUrl
        ? "Stored in your Cloudflare bucket."
        : "Nothing uploaded yet — click Upload to add one.";

      const btnRow = document.createElement("div");
      btnRow.className = "cms-media-btn-row";

      function makeFileTrigger(labelText, danger) {
        const lbl = document.createElement("label");
        lbl.className = "cms-upload-label" + (danger ? " danger" : "");
        lbl.textContent = labelText;
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "video/*";
        input.style.display = "none";
        lbl.appendChild(input);
        return { lbl, input };
      }

      async function handleUploadOrChange(file, isChange) {
        hint.textContent = "Uploading…";
        hint.className = "cms-hint";
        try {
          const oldKey = getPath(content, "home.heroVideoKey");
          const result = await uploadToWorker(file);
          if (isChange && oldKey) {
            await deleteFromWorker(oldKey).catch((e) => console.warn("Old video cleanup failed:", e));
          }
          setPath(content, "home.heroVideo", result.url);
          setPath(content, "home.heroVideoKey", result.key);
          saveLocalPreview();
          renderPages(); // re-render this page so preview/buttons update
        } catch (e) {
          hint.textContent = e.message || "Upload failed.";
          hint.className = "cms-hint error";
        }
      }

      if (!currentUrl) {
        const { lbl, input } = makeFileTrigger("Upload video");
        input.addEventListener("change", () => {
          if (input.files[0]) handleUploadOrChange(input.files[0], false);
        });
        btnRow.appendChild(lbl);
      } else {
        const { lbl: changeLbl, input: changeInput } = makeFileTrigger("Change video");
        changeInput.addEventListener("change", () => {
          if (changeInput.files[0]) handleUploadOrChange(changeInput.files[0], true);
        });
        btnRow.appendChild(changeLbl);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "cms-upload-label danger";
        deleteBtn.textContent = "Delete video";
        deleteBtn.addEventListener("click", async () => {
          if (!confirm("Delete the current background video from the bucket? This can't be undone.")) return;
          hint.textContent = "Deleting…";
          try {
            const oldKey = getPath(content, "home.heroVideoKey");
            if (oldKey) await deleteFromWorker(oldKey);
            setPath(content, "home.heroVideo", "");
            setPath(content, "home.heroVideoKey", "");
            saveLocalPreview();
            renderPages();
          } catch (e) {
            hint.textContent = e.message || "Delete failed.";
            hint.className = "cms-hint error";
          }
        });
        btnRow.appendChild(deleteBtn);
      }

      controls.appendChild(btnRow);
      controls.appendChild(hint);
      row.appendChild(controls);
      wrap.appendChild(row);
      return wrap;
    }

    function renderConnectionsPage() {
      const container = document.createElement("div");

      const notice = document.createElement("div");
      notice.className = "cms-notice";
      notice.innerHTML = `
        <strong>Cloudflare Worker URL</strong> — needed for the Upload / Change / Delete
        buttons (like the Home background video) to talk to your R2 bucket.
        Paste the <code>workers.dev</code> URL from <code>wrangler deploy</code> below.
        Saved only in this browser.
        <input type="text" id="workerUrlInput" placeholder="https://tmb-media-uploader.your-subdomain.workers.dev" />
      `;
      container.appendChild(notice);

      const saveBtn = document.createElement("button");
      saveBtn.className = "cms-btn primary";
      saveBtn.textContent = "Save Worker URL";
      saveBtn.style.marginBottom = "2rem";
      container.appendChild(saveBtn);

      setTimeout(() => {
        const input = document.getElementById("workerUrlInput");
        input.value = getWorkerUrl();
        saveBtn.addEventListener("click", () => {
          setWorkerUrl(input.value);
          flashStatus("Worker URL saved", "saved");
        });
      }, 0);

      const howNotice = document.createElement("div");
      howNotice.className = "cms-notice";
      howNotice.innerHTML = `
        <strong>How publishing works.</strong> This site has no server for text/image
        fields, so those edits live only in this browser until you publish them.
        <ol style="margin: 0.75rem 0 0 1.25rem;">
          <li>Edit fields on the other pages — each change auto-saves as a local preview.</li>
          <li>Use the preview links below to check how it looks.</li>
          <li>Click <strong>Download content.json</strong> (top right) and replace the file in your repo, then commit &amp; push.</li>
        </ol>
        <p style="margin-top: 0.75rem;">The Home background video is the exception — Upload/Change/Delete there writes straight to your Cloudflare bucket immediately, no publish step needed for the file itself (though you still need to download &amp; commit content.json so the new URL is saved).</p>
      `;
      container.appendChild(howNotice);

      const previewLinks = document.createElement("div");
      previewLinks.className = "cms-preview-links";
      previewLinks.innerHTML = `
        <a class="cms-btn" href="./index.html" target="_blank" rel="noopener">Preview Home &nbsp;&#8594;</a>
        <a class="cms-btn" href="./ngilai.html" target="_blank" rel="noopener">Preview NGILAI &nbsp;&#8594;</a>
        <a class="cms-btn" href="./lifegacha.html" target="_blank" rel="noopener">Preview Life Gacha! &nbsp;&#8594;</a>
      `;
      container.appendChild(previewLinks);

      return container;
    }

    function renderPages() {
      const pagesEl = document.getElementById("pagesEl");
      const activeIdBefore = document.querySelector(".cms-page.active")?.id?.replace("page-", "") || PAGES[0].id;
      pagesEl.innerHTML = "";

      const toolbar = document.createElement("div");
      toolbar.className = "cms-toolbar";
      toolbar.innerHTML = `
        <span class="cms-status saved" id="statusEl">All changes saved to this browser</span>
        <div class="cms-toolbar-actions">
          <button class="cms-btn" id="saveNowBtn">Save Now</button>
          <button class="cms-btn" id="resetBtn">Discard preview</button>
          <button class="cms-btn primary" id="exportBtn">Download content.json</button>
        </div>
      `;
      pagesEl.appendChild(toolbar);

      PAGES.forEach((page) => {
        const pageEl = document.createElement("div");
        pageEl.className = "cms-page" + (page.id === activeIdBefore ? " active" : "");
        pageEl.id = "page-" + page.id;

        if (page.kind === "connections") {
          const header = document.createElement("div");
          header.className = "cms-page-header";
          header.innerHTML = `<h1>Connections</h1><p>Backend wiring for the CMS itself.</p>`;
          pageEl.appendChild(header);
          pageEl.appendChild(renderConnectionsPage());
        } else {
          const header = document.createElement("div");
          header.className = "cms-page-header";
          header.innerHTML = `<h1>${page.label}</h1><p>${page.description || ""}</p>`;
          pageEl.appendChild(header);

          if (page.id === "home") {
            pageEl.appendChild(renderManagedVideoField());
          }
          page.fields.forEach(field => {
            const el = (field.type === "image" || field.type === "video")
              ? renderSimpleMediaField(field)
              : renderTextField(field);
            pageEl.appendChild(el);
          });
        }

        pagesEl.appendChild(pageEl);
      });

      document.getElementById("saveNowBtn").addEventListener("click", () => {
        saveLocalPreview();
      });
      document.getElementById("exportBtn").addEventListener("click", downloadContentJson);
      document.getElementById("resetBtn").addEventListener("click", async () => {
        if (!confirm("Discard all local preview edits and reload from the published content.json?")) return;
        localStorage.removeItem(CMS_KEY);
        await loadContent();
        renderPages();
        flashStatus("Local preview discarded");
      });
    }

    function downloadContentJson() {
      const blob = new Blob([JSON.stringify(content, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "content.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    /* ============================================================
       AUTH
       ============================================================ */
    async function bootCms() {
      document.getElementById("loginShell").style.display = "none";
      document.getElementById("cmsApp").classList.add("ready");
      document.getElementById("userEmail").textContent = session.user.email;
      await loadContent();
      renderSidebar();
      renderPages();
    }

    async function init() {
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) {
        session = data.session;
        await bootCms();
      }
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const errorEl = document.getElementById("loginError");
      errorEl.textContent = "";
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = error.message;
        return;
      }
      session = data.session;
      await bootCms();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      session = null;
      document.getElementById("cmsApp").classList.remove("ready");
      document.getElementById("loginShell").style.display = "flex";
    });

    init();
  </script>
</body>
</html>
